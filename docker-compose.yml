version: '3.8'

services:
  #base de données postgreSQL
  db:
    image: postgres:15-alpine
    container_name: priceComparator_DB
    restart: always
    environment:
      POSTGRES_USER: pc_user
      POSTGRES_PASSWORD: pc_password
      POSTGRES_DB: pc_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: